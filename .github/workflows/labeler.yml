name: Label pull requests
on:
  pull_request_target:
permissions:
  contents: read
  pull-requests: write
jobs:
  labeler:
    name: Apply labels based on changed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
